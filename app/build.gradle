plugins { id 'com.android.application' }

android {
    namespace 'com.vietradio.android6'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vietradio.android6'
        minSdk 23
        targetSdk 28
        versionCode 30
        versionName '3.16'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Media3 player supports HLS streams and a custom OkHttp TLS configuration.
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// Avoid duplicate Kotlin classes pulled by older transitive dependencies.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
